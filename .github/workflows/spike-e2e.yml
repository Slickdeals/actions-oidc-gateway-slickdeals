name: ENGOPS-265 SPIKE e2e – gateway test (TGW path)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  proxy-via-gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api%3A%2F%2FActionsOIDCGateway" \
            | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Proxy to staging.ui.eks.slickdeals.tech via gateway (TGW path, no VPCE)
        run: |
          # TGW path test: target a real staging cluster ingress hostname instead
          # of the SPIKE's PrivateLink-fronted demo nginx.
          #
          # Flow:
          #   gateway resolves staging.ui.eks.slickdeals.tech via public DNS
          #     → returns staging CLB's internal IPs (10.154.x)
          #   gateway opens TCP 10.154.x:443 from shared-network VPC
          #     → matches managed prefix list pl-0012f67f3104c836c (sd_cloud_vpcs)
          #     → TGW (tgw-04becaec027e9040a, propagated route to staging attachment)
          #     → staging VPC → ingress-nginx-internal CLB
          #     → ingress-nginx controller → nuxt-web-ui-staging pod
          #
          # No VPCE, no PHZ, no VES involved. Uses --fail-with-body so curl exits
          # non-zero on HTTP >=400 but still writes the body for diagnostics.
          curl -v --proxytunnel --fail-with-body \
            --proxy https://actions-gateway.slickdeals.tech \
            --proxy-header "Gateway-Authorization: ${{ steps.oidc.outputs.token }}" \
            https://staging.ui.eks.slickdeals.tech/ \
            -o response.html
          echo "----- response head -----"
          head -c 2000 response.html || true
          echo
          echo "----- response size -----"
          wc -c response.html

      - name: Negative test - rogue audience must be rejected
        run: |
          BAD_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=wrong-audience" \
            | jq -r .value)
          # Use --proxytunnel so curl sends a CONNECT request the gateway will
          # validate. Use %{http_connect} (not %{http_code}) — when CONNECT
          # fails, %{http_code} is "000" but %{http_connect} carries the proxy
          # response code (e.g. 401). Capture curl's stderr and exit code so
          # transport failures (DNS, TLS, proxy unreachable) are distinguishable
          # from an expected 401/403 auth rejection.
          ERR=$(mktemp)
          set +e
          PROXY_CODE=$(curl -sS -o /dev/null -w "%{http_connect}" --proxytunnel \
            --proxy https://actions-gateway.slickdeals.tech \
            --proxy-header "Gateway-Authorization: $BAD_TOKEN" \
            https://staging.ui.eks.slickdeals.tech/ 2>"$ERR")
          CURL_RC=$?
          set -e
          echo "curl exit: $CURL_RC; proxy CONNECT code: '$PROXY_CODE' (expected 401 or 403)"
          if [ "$PROXY_CODE" != "401" ] && [ "$PROXY_CODE" != "403" ]; then
            echo "ERROR: expected 401/403 for bad audience, got '$PROXY_CODE' (curl exit $CURL_RC)" >&2
            echo "----- curl stderr -----" >&2
            cat "$ERR" >&2
            exit 1
          fi
