name: Run CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  run_ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Read Go version from go.mod so version bumps don't require a
          # separate CI change (and CI can't silently fall behind the code).
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
